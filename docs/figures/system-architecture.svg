<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Processor pipeline and the MEM-stage integration point</title><desc id="desc">A five-stage pipeline routes MMIO requests through the memory stage to AES, sensor SPI, UART, interrupt, DMA and power blocks.</desc>
<rect width="1100" height="700" fill="#F5EFE1"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3E706B"/></marker></defs>
<text x="50" y="48" fill="#65736A" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start">LOW-POWER AES / RISC-V</text>
<text x="50" y="91" fill="#293B3B" font-family="Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="start">Processor pipeline and the MEM-stage integration point</text>
<rect x="50" y="145" width="180" height="90" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="66" y="176" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">IF</text>
<text x="66" y="203" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Fetch</text>
<path d="M230 190 L248 190" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="255" y="145" width="180" height="90" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="271" y="176" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">ID</text>
<text x="271" y="203" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Decode</text>
<path d="M435 190 L453 190" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="145" width="180" height="90" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="476" y="176" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">EX</text>
<text x="476" y="203" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">ALU / address</text>
<path d="M640 190 L658 190" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="665" y="145" width="180" height="90" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="681" y="176" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">MEM</text>
<text x="681" y="203" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">RAM / MMIO</text>
<path d="M845 190 L863 190" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="870" y="145" width="180" height="90" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="886" y="176" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">WB</text>
<text x="886" y="203" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Writeback</text>
<rect x="50" y="290" width="1000" height="70" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="66" y="321" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">MEM-stage address decode and read-data multiplexer</text>
<path d="M755 235 L755 283" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M155 360 L155 400" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="407" width="220" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="66" y="438" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">AES / AES-CTR</text>
<text x="66" y="465" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x300</text>
<text x="66" y="490" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Reusable 128-bit core</text>
<path d="M415 360 L415 400" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="407" width="220" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="326" y="438" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">Sensor / SPI</text>
<text x="326" y="465" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x400</text>
<text x="326" y="490" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">SPI IP + sensor wrapper</text>
<path d="M675 360 L675 400" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="407" width="220" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="586" y="438" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">UART TX</text>
<text x="586" y="465" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x500</text>
<text x="586" y="490" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Byte serial output</text>
<path d="M935 360 L935 400" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="830" y="407" width="220" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="846" y="438" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">Data RAM</text>
<text x="846" y="465" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">256 x 32-bit words</text>
<text x="846" y="490" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">CPU and DMA ports</text>
<path d="M290 360 L290 535 L315 535 L315 550" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="180" y="557" width="270" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="196" y="588" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">Interrupt status</text>
<text x="196" y="615" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x600 / sticky pending</text>
<text x="196" y="640" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">IRQ exposed; no CPU trap path</text>
<path d="M550 360 L550 535 L615 535 L615 550" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="480" y="557" width="270" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="496" y="588" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">DMA-lite</text>
<text x="496" y="615" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x700 / RAM word copy</text>
<text x="496" y="640" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Direct second RAM port</text>
<path d="M810 360 L810 535 L915 535 L915 550" fill="none" stroke="#3E706B" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="780" y="557" width="270" height="110" rx="4" fill="#FFFCF5" stroke="#3E706B" stroke-width="1.5"/>
<text x="796" y="588" fill="#3E706B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">Power / activity</text>
<text x="796" y="615" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">0x800 / counters + sleep</text>
<text x="796" y="640" fill="#293B3B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Selected peripheral enables</text>
<text x="50" y="687" fill="#65736A" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Solid paths show major integration points; dashed branches are schematic, not a bus protocol.</text>
</svg>
